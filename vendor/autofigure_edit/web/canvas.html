<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- FIGURESMITH-BEGIN phase5-brand -->
    <title>FigureSmith — Canvas</title>
    <link rel="icon" href="/fs/brand-mark.svg" type="image/svg+xml" />
    <!-- FIGURESMITH-END phase5-brand -->
    <link rel="stylesheet" href="/fs/common.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/figuresmith-bridge.js"></script>
    <script src="/fs/common.js"></script>
    <script>
      if (window.FigureSmithUI && FigureSmithUI.applyTheme) FigureSmithUI.applyTheme();
    </script>
  </head>
  <body data-page="canvas">
    <div class="canvas-page">
      <header class="topbar">
        <div>
          <div class="brand">
            <!-- FIGURESMITH-BEGIN phase5-brand -->
            <img class="brand-logo" src="/fs/brand-mark.svg" alt="FigureSmith" />
            <span id="canvasBrandTitle">FigureSmith Canvas</span>
            <!-- FIGURESMITH-END phase5-brand -->
          </div>
          <div class="subtitle">
            <span id="canvasStatusLabel">Status:</span> <span id="statusText">Waiting</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="ghost" id="backToConfigBtn">Back to Config</button>
          <!-- FIGURESMITH-BEGIN phase5-nav -->
          <a class="ghost topbar-link" id="canvasModelsBtn" href="/models.html">Models</a>
          <a class="ghost topbar-link history-action" id="canvasHistoryBtn" href="/history.html">History</a>
          <!-- FIGURESMITH-END phase5-nav -->
          <button class="ghost" id="logToggle">Logs</button>
          <div class="lang-switch" data-lang-switch>
            <button type="button" class="lang-chip" data-lang="zh">中文</button>
            <button type="button" class="lang-chip" data-lang="en">EN</button>
          </div>
          <div class="theme-switch" data-fs-theme-switch></div>
          <div class="job-pill"><span id="canvasJobLabel">Job</span> <span id="jobId"></span></div>
        </div>
      </header>

      <main class="canvas-stage">
        <div class="canvas-shell">
          <iframe
            id="svgEditorFrame"
            class="svg-frame"
            title="SVG-Edit Canvas"
          ></iframe>
          <div id="svgFallback" class="svg-fallback">
            <div class="fallback-title" id="fallbackTitle">SVG-Edit not installed</div>
            <div class="fallback-body" id="fallbackBody">
              Drop an SVG-Edit build into <code>web/vendor/svg-edit/</code> (editor/index.html) to enable editing.
            </div>
            <img id="fallbackImage" class="fallback-object" alt="" />
          </div>
        </div>
      </main>

      <button class="fab" id="artifactToggle" aria-label="Artifacts">
        <svg class="fab-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2v10h14V7H5zm2 8l3-3 2 2 3-3 4 4H7z"
            fill="#f2f2f2"
          />
        </svg>
      </button>

      <aside class="artifact-panel" id="artifactPanel">
        <div class="panel-header" id="artifactPanelTitle">Artifacts</div>
        <div class="artifact-list" id="artifactList"></div>
      </aside>

      <aside class="log-panel" id="logPanel">
        <div class="panel-header" id="logPanelTitle">Logs</div>
        <div class="log-body" id="logBody"></div>
      </aside>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
