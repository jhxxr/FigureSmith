# FigureSmith — Windows release (automatic packaging + GitHub Release)
#
# Triggers:
#   - push tag v*     → test → runtime + desktop packs → GitHub Release
#   - workflow_dispatch → manual packaging trial (never publishes)
#
# Hard rule: never upload model weights (*.pt, *.safetensors, …).

name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_desktop:
        description: "Skip Tauri desktop build (runtime-only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend test deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/runtime/requirements-bootstrap.txt pytest httpx

      - name: Assert tag matches VERSION (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./scripts/ci/assert-version-tag.ps1

      - name: Assert all version sources match VERSION
        shell: pwsh
        run: ./scripts/ci/sync-version.ps1 -CheckOnly

      - name: Run pytest
        shell: pwsh
        run: |
          $env:PYTHONPATH = "apps/backend;vendor/autofigure_edit"
          $env:FIGURESMITH_DISABLE_AUTH = "1"
          python -m pytest tests -q

  package-runtime:
    name: package-runtime
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install runtime assembly tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install zstandard

      - name: Validate committed CPU and CUDA lock bundles
        shell: pwsh
        run: |
          ./scripts/validate-runtime-locks.ps1 -LockRoot locks -Variant cpu
          ./scripts/validate-runtime-locks.ps1 -LockRoot locks -Variant cu128

      - name: Acquire pinned CPU wheelhouse
        shell: pwsh
        run: python scripts/runtime/fetch_wheelhouse.py --variant cpu --lock-root locks --out build/wheelhouse-cpu

      - name: Acquire pinned CPU source archives
        shell: pwsh
        run: python scripts/runtime/assemble_runtime.py --variant cpu --lock-root locks --cache build/source-cache --fetch-sources

      - name: Validate acquired CPU wheelhouse
        shell: pwsh
        run: ./scripts/validate-runtime-locks.ps1 -LockRoot locks -Variant cpu -Wheelhouse build/wheelhouse-cpu

      - name: Build CPU Runtime V1 pack
        shell: pwsh
        run: ./scripts/build-runtime.ps1 -Variant cpu -Wheelhouse build/wheelhouse-cpu

      - name: Validate CPU Runtime V1 manifest and artifacts
        shell: pwsh
        run: |
          $expectedVersion = (Get-Content VERSION -Raw).Trim()
          $packName = "FigureSmith-Runtime-Windows-CPU-$expectedVersion"
          $runtimeRoot = Join-Path "dist-runtime" $packName

          $runtimeDirs = @(Get-ChildItem -Path dist-runtime -Directory)
          if ($runtimeDirs.Count -ne 1 -or $runtimeDirs[0].Name -ne $packName) {
            $names = ($runtimeDirs | ForEach-Object Name) -join ", "
            throw "Expected exactly one CPU runtime directory '$packName', found: $names"
          }
          if (-not (Test-Path (Join-Path "dist-runtime" "$packName.zip") -PathType Leaf)) { throw "CPU runtime zip is missing" }
          if (-not (Test-Path (Join-Path "dist-runtime" "checksums.txt") -PathType Leaf)) { throw "Runtime checksums are missing" }
          foreach ($relative in @(
            "runtime-manifest.json",
            "python/python.exe",
            "python/python312._pth",
            "app/backend/main.py",
            "app/vendor/autofigure_edit/server.py",
            "app/backend/figuresmith/runtime/dependencies.json",
            "locks/requirements-win-py312-cpu.lock.json",
            "locks/sources-cpu.lock.json",
            "locks/wheelhouse-cpu.manifest.json",
            "locks/requirements-cpu.txt"
          )) {
            if (-not (Test-Path (Join-Path $runtimeRoot $relative) -PathType Leaf)) {
              throw "Missing application runtime file: $relative"
            }
          }
          $manifest = Get-Content (Join-Path $runtimeRoot "runtime-manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.product -ne "FigureSmith") { throw "Runtime manifest product is not FigureSmith" }
          if ($manifest.version -ne $expectedVersion) { throw "Runtime manifest version mismatch" }
          if ($manifest.schema -ne 2) { throw "Runtime manifest schema is not 2" }
          if ($manifest.variant -ne "cpu") { throw "Release runtime must be the CPU variant" }
          if ($manifest.runtime_complete -ne $true) { throw "Runtime manifest does not declare a complete runtime" }
          if ($manifest.contains_weights -ne $false -or $manifest.contains_cache -ne $false) { throw "Runtime manifest safety flags are invalid" }
          if (Get-ChildItem -Path $runtimeRoot -Recurse -File -Filter "*.whl" | Select-Object -First 1) {
            throw "Runtime pack must not contain loose dependency wheels"
          }
          $oldPythonPath = $env:PYTHONPATH
          try {
            $env:PYTHONPATH = Join-Path $PWD "apps/backend"
            python -B -m figuresmith.runtime.manifest (Join-Path $runtimeRoot "runtime-manifest.json") $runtimeRoot
            if ($LASTEXITCODE -ne 0) { throw "Independent Runtime V1 manifest verification failed" }
          } finally {
            if ($null -eq $oldPythonPath) { Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue }
            else { $env:PYTHONPATH = $oldPythonPath }
          }

      - name: Assert no model weights
        shell: pwsh
        run: ./scripts/ci/assert-no-weights.ps1 -Path dist-runtime

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: figuresmith-runtime-cpu
          path: |
            dist-runtime/FigureSmith-Runtime-Windows-CPU-*.zip
            dist-runtime/checksums.txt
            dist-runtime/FigureSmith-Runtime-Windows-CPU-*/runtime-manifest.json
          if-no-files-found: error
          retention-days: 14

  package-desktop:
    name: package-desktop
    needs: [test, package-runtime]
    if: ${{ github.event_name == 'push' || inputs.skip_desktop == false }}
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust / Tauri target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: figuresmith-tauri-windows

      - name: Sync version from VERSION file
        shell: pwsh
        run: ./scripts/ci/sync-version.ps1

      - name: Download application runtime pack
        uses: actions/download-artifact@v4
        with:
          name: figuresmith-runtime-cpu
          path: downloaded-runtime

      - name: Stage application pack for Tauri resources
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path downloaded-runtime -Recurse -Filter "FigureSmith-Runtime-*.zip" -File | Select-Object -First 1
          if ($null -eq $zip) { throw "Application runtime zip was not downloaded" }
          $expanded = Join-Path $env:RUNNER_TEMP "figuresmith-runtime-expanded"
          if (Test-Path $expanded) { Remove-Item $expanded -Recurse -Force }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $expanded -Force
          $manifestFiles = @(Get-ChildItem -Path $expanded -Recurse -Filter "runtime-manifest.json" -File)
          if ($manifestFiles.Count -ne 1) { throw "Expected exactly one runtime-manifest.json after extraction, found $($manifestFiles.Count)" }
          $pack = $manifestFiles[0].Directory
          if ($null -eq $pack) { throw "Runtime archive manifest has no parent directory" }
          $target = Join-Path $PWD "apps/desktop/src-tauri/runtime"
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          # Copy each top-level entry explicitly so PowerShell does not nest the
          # extracted pack directory or drop its root files.
          Get-ChildItem -LiteralPath $pack.FullName -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $target $_.Name) -Recurse -Force
          }
          $manifestPath = Join-Path $target "runtime-manifest.json"
          if (-not (Test-Path $manifestPath -PathType Leaf)) { throw "Staged application pack is missing runtime-manifest.json" }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 2 -or $manifest.variant -ne "cpu" -or $manifest.runtime_complete -ne $true) { throw "Downloaded runtime is not a complete CPU Runtime V1 pack" }
          if (-not (Test-Path (Join-Path $target "python/python.exe") -PathType Leaf)) { throw "Embedded CPU Python is missing" }
          if (-not (Test-Path (Join-Path $target "locks/requirements-win-py312-cpu.lock.json") -PathType Leaf)) { throw "CPU requirements lock is missing" }

      - name: Install desktop npm deps
        working-directory: apps/desktop
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Build desktop packages
        shell: pwsh
        run: ./scripts/build-desktop.ps1
        env:
          # Reduce noise; Tauri may need CI=true
          CI: "true"

      - name: Assert no model weights
        shell: pwsh
        run: ./scripts/ci/assert-no-weights.ps1 -Path dist-desktop

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: figuresmith-desktop
          path: |
            dist-desktop/FigureSmith-*.exe
            dist-desktop/FigureSmith-*.msi
            dist-desktop/FigureSmith-Portable-*.zip
            dist-desktop/checksums.txt
            dist-desktop/**/README-PORTABLE.md
          if-no-files-found: error
          retention-days: 14

  release:
    name: github-release
    needs: [package-runtime, package-desktop]
    # Manual dispatch is a packaging trial only. Publishing requires a tag.
    if: |
      always() &&
      needs.package-runtime.result == 'success' &&
      needs.package-desktop.result == 'success' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download runtime artifacts
        uses: actions/download-artifact@v4
        with:
          name: figuresmith-runtime-cpu
          path: release-assets/runtime

      - name: Download desktop artifacts
        if: needs.package-desktop.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: figuresmith-desktop
          path: release-assets/desktop

      - name: Resolve version + release notes
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(tr -d ' \n\r' < VERSION)"
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          # extract-changelog is PowerShell; use python fallback on ubuntu for notes
          export VER
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          ver = os.environ.get("VER") or Path("VERSION").read_text(encoding="utf-8").strip()
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pat = rf"(?ms)^## \[{re.escape(ver)}\].*?(?=^## \[|\Z)"
          m = re.search(pat, text)
          body = m.group(0).strip() if m else f"## FigureSmith v{ver}\n\nAutomated release. See CHANGELOG.md."
          notes = (
              f"FigureSmith **v{ver}** automatic release.\n\n{body}\n\n"
              "---\n\n"
              "**Models are external.** SAM3 / RMBG checkpoints are not included; "
              "download and import them on the target machine after installation.\n"
              "**Self-contained CPU Runtime V1:** the Windows runtime archive includes embedded CPython 3.12, hash-locked CPU packages, and native runtime DLLs. No system Python, venv creation, pip, or online dependency installation is needed on the target machine. "
              "This release publishes the CPU runtime only; the cu128 lock remains available for maintainer/manual builds but is not uploaded as a release asset. "
              "A supported WebView2 and Visual C++ runtime are still required.\n"
              "Source license ≠ third-party model weight licenses.\n"
          )
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          print(f"Wrote release-notes.md for {ver}")
          PY
      - name: Collect asset files
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          # Flatten zips/exe/msi/checksums into upload/
          find release-assets -type f \( \
            -name '*.zip' -o -name '*.exe' -o -name '*.msi' -o -name 'checksums.txt' -o -name 'MANIFEST.json' -o -name 'runtime-manifest.json' \
          \) -print0 | while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            # avoid overwrite: prefix if needed
            dest="upload/$base"
            if [[ -e "$dest" ]]; then
              dest="upload/$(echo "$f" | sed 's#release-assets/##;s#/#_#g')"
            fi
            cp -v "$f" "$dest"
          done
          ls -la upload
          # Build multiline file list for softprops
          {
            echo "files<<EOF"
            find upload -type f | sort
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Re-assert no weights in upload folder
        shell: bash
        run: |
          set -euo pipefail
          if find upload -type f \( \
              -iname '*.pt' -o -iname '*.pth' -o -iname '*.onnx' -o -iname '*.safetensors' \
              -o -iname '*.gguf' -o -iname '*.ckpt' -o -iname '*.h5' -o -iname '*.pb' \
              -o -iname '*.bin' \
            \) | grep -q .; then
            echo "ERROR: weight-like files in upload/"
            find upload -type f | sort
            exit 1
          fi
          echo "OK: upload/ has no weight extensions"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: FigureSmith v${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            upload/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
