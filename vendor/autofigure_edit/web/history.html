<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- FIGURESMITH-BEGIN phase5-brand -->
    <title>FigureSmith — History</title>
    <link rel="icon" href="/fs/brand-mark.svg" type="image/svg+xml" />
    <!-- FIGURESMITH-END phase5-brand -->
    <link rel="stylesheet" href="/styles.css" />
    <script src="/figuresmith-bridge.js"></script>
  </head>
  <body data-page="history">
    <div class="page">
      <header class="topbar">
        <div>
          <div class="brand">
            <!-- FIGURESMITH-BEGIN phase5-brand -->
            <img class="brand-logo" src="/fs/brand-mark.svg" alt="FigureSmith" />
            <span id="historyBrandTitle">History</span>
            <!-- FIGURESMITH-END phase5-brand -->
          </div>
          <div class="subtitle" id="historySubtitle">Saved FigureSmith outputs.</div>
        </div>
        <div class="topbar-actions">
          <!-- FIGURESMITH-BEGIN phase5-nav -->
          <a class="ghost topbar-link" id="historyWelcomeBtn" href="/welcome.html">Welcome</a>
          <a class="ghost topbar-link" id="historyBackInputBtn" href="/">Create</a>
          <a class="ghost topbar-link" id="historyBackImportBtn" href="/import.html">Import</a>
          <a class="ghost topbar-link" id="historyModelsBtn" href="/models.html">Models</a>
          <a class="ghost topbar-link" id="historyGuideBtn" href="/guide.html">Guide</a>
          <!-- FIGURESMITH-END phase5-nav -->
          <button class="ghost" id="historyRefreshBtn" type="button">Refresh</button>
          <div class="lang-switch" data-lang-switch>
            <button type="button" class="lang-chip" data-lang="zh">中文</button>
            <button type="button" class="lang-chip" data-lang="en">EN</button>
          </div>
        </div>
      </header>

      <main class="history-layout">
        <section class="history-summary">
          <div class="panel-header" id="historySummaryTitle">Saved Images</div>
          <div class="history-count" id="historyCount">0 items</div>
        </section>

        <section class="history-grid" id="historyGrid" aria-live="polite"></section>

        <section class="card history-empty" id="historyEmpty" hidden>
          <div class="panel-header" id="historyEmptyTitle">No history yet</div>
          <div class="guide-copy" id="historyEmptyBody">Saved outputs will appear here after a run writes files into outputs/.</div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
