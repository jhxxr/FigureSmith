<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FigureSmith</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1220;
        color: #e8eef9;
      }
      .card {
        width: min(420px, 92vw);
        padding: 1.5rem 1.75rem;
        border-radius: 14px;
        background: #121a2b;
        border: 1px solid #24314d;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.35rem;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0.35rem 0;
        color: #a9b6d3;
        line-height: 1.45;
      }
      #status {
        margin-top: 1rem;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.85rem;
        color: #7dd3c7;
        white-space: pre-wrap;
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.8rem;
        color: #7f8bab;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>FigureSmith / 图匠</h1>
      <p>Starting local Python sidecar and loading the editor…</p>
      <div id="status">Initializing…</div>
      <p class="hint">
        Model import is also available from the app menu (Models). The main UI is
        served by the local backend on 127.0.0.1.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
