# Lightweight CI for PRs and default-branch pushes.
# Does NOT run full Tauri desktop builds (those are release-windows only).

name: ci

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/runtime/requirements-bootstrap.txt pytest httpx

      - name: Pytest
        shell: pwsh
        run: |
          $env:PYTHONPATH = "apps/backend;vendor/autofigure_edit"
          $env:FIGURESMITH_DISABLE_AUTH = "1"
          python -m pytest tests -q

  runtime-pack-smoke:
    name: cpu-runtime-pack-smoke
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime assembly tooling
        shell: pwsh
        run: python -m pip install --upgrade pip zstandard

      - name: Validate committed CPU and CUDA lock bundles
        shell: pwsh
        run: |
          ./scripts/validate-runtime-locks.ps1 -LockRoot locks -Variant cpu
          ./scripts/validate-runtime-locks.ps1 -LockRoot locks -Variant cu128

      - name: Acquire pinned CPU wheelhouse
        shell: pwsh
        run: python scripts/runtime/fetch_wheelhouse.py --variant cpu --lock-root locks --out build/wheelhouse-cpu

      - name: Acquire pinned CPU source archives
        shell: pwsh
        run: python scripts/runtime/assemble_runtime.py --variant cpu --lock-root locks --cache build/source-cache --fetch-sources

      - name: Validate acquired CPU wheelhouse
        shell: pwsh
        run: ./scripts/validate-runtime-locks.ps1 -LockRoot locks -Variant cpu -Wheelhouse build/wheelhouse-cpu

      - name: Build CPU Runtime V1 pack
        shell: pwsh
        run: ./scripts/build-runtime.ps1 -Variant cpu -Wheelhouse build/wheelhouse-cpu -SkipZip

      - name: Assert no weights
        shell: pwsh
        run: ./scripts/ci/assert-no-weights.ps1 -Path dist-runtime

      - name: Upload smoke artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke
          path: |
            dist-runtime/**/MANIFEST.json
            dist-runtime/checksums.txt
          if-no-files-found: warn
          retention-days: 7
